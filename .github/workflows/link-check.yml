name: Check documentation links

# Microsoft Learn URLs move. This runs weekly and opens an issue listing broken links.
on:
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC (07:00 SAST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: List documentation URLs
        run: node tools/validate-data.mjs --urls > lychee-urls.txt
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,429
            lychee-urls.txt
          output: ./lychee/out.md
          fail: false
      - name: Open issue if links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken documentation links
          content-filepath: ./lychee/out.md
          labels: data, links
