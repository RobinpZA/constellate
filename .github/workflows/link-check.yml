name: Check documentation links

# Microsoft Learn URLs move. This runs weekly and opens an issue listing broken links.
on:
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC (07:00 SAST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: List documentation URLs
        run: node tools/validate-data.mjs --urls > lychee-urls.txt
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,429
            lychee-urls.txt
          output: ./lychee/out.md
          fail: false
      - name: Update link check issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BROKEN: ${{ steps.lychee.outputs.exit_code != 0 }}
        run: |
          gh label create links --force --description "Broken documentation links" || true
          n=$(gh issue list --state open --search 'in:title "Broken documentation links"' --json number --jq '.[0].number // empty')
          if [ "$BROKEN" = "true" ]; then
            if [ -n "$n" ]; then gh issue edit "$n" --body-file ./lychee/out.md
            else gh issue create --title "Broken documentation links" --body-file ./lychee/out.md --label links; fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "All documentation links pass."
          fi
